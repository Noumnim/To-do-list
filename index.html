<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskflow — To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <span>Taskflow</span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="all">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
          All tasks <span class="count" id="count-all">0</span>
        </button>
        <button class="nav-item" data-view="today">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          Today <span class="count" id="count-today">0</span>
        </button>
        <button class="nav-item" data-view="upcoming">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Upcoming <span class="count" id="count-upcoming">0</span>
        </button>
        <button class="nav-item" data-view="important">
          <svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
          High priority <span class="count" id="count-important">0</span>
        </button>
        <button class="nav-item" data-view="completed">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
          Completed <span class="count" id="count-completed">0</span>
        </button>
      </nav>

      <div class="progress-card">
        <div class="ring">
          <svg viewBox="0 0 36 36">
            <circle class="ring-bg" cx="18" cy="18" r="15.9" />
            <circle class="ring-fg" id="ring" cx="18" cy="18" r="15.9" />
          </svg>
          <span id="ring-label">0%</span>
        </div>
        <div>
          <p class="progress-title">Daily progress</p>
          <p class="progress-sub" id="progress-sub">0 of 0 done</p>
        </div>
      </div>

      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span id="theme-label">Dark mode</span>
      </button>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <p class="date" id="today-date"></p>
          <h1 id="view-title">All tasks</h1>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" placeholder="Search tasks…" />
        </div>
      </header>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-main">
          <span class="plus">+</span>
          <input type="text" id="task-input" placeholder="Add a new task and press Enter" maxlength="140" required />
        </div>
        <div class="composer-meta">
          <label class="chip-input" title="Due date">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <input type="date" id="task-date" />
          </label>
          <select id="task-priority" class="chip-select" title="Priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button type="submit" class="btn-primary">Add task</button>
        </div>
      </form>

      <div class="toolbar">
        <div class="tabs" id="sort-tabs">
          <button class="tab active" data-sort="created">Newest</button>
          <button class="tab" data-sort="due">Due date</button>
          <button class="tab" data-sort="priority">Priority</button>
        </div>
        <button class="btn-ghost" id="clear-completed">Clear completed</button>
      </div>

      <ul class="task-list" id="task-list"></ul>

      <div class="empty" id="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <h3>Nothing here yet</h3>
        <p>Add a task above to get started.</p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
