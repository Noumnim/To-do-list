<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskflow — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <script src="auth.js"></script>
  <script>Auth.redirectIfAuthed();</script>
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="brand auth-brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <span>Taskflow</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to continue to your tasks.</p>

      <div class="alert" id="form-alert" role="alert" data-testid="login-alert" hidden></div>

      <form id="login-form" class="auth-form" novalidate data-testid="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" data-testid="login-email" />
          <p class="field-error" id="email-error" data-testid="login-email-error"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" data-testid="login-password" />
            <button type="button" class="toggle-pw" data-target="password" aria-label="Show password" data-testid="login-toggle-password">Show</button>
          </div>
          <p class="field-error" id="password-error" data-testid="login-password-error"></p>
        </div>

        <label class="checkbox">
          <input type="checkbox" id="remember" name="remember" data-testid="login-remember" />
          <span>Remember me</span>
        </label>

        <button type="submit" class="btn-primary btn-block" id="login-submit" data-testid="login-submit">Sign in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html" id="go-register" data-testid="go-register">Create one</a></p>

      <div class="demo-hint" data-testid="demo-hint">
        <strong>Demo account:</strong> demo@taskflow.com / Demo@1234
      </div>
    </div>
  </main>

  <script src="auth-page.js"></script>
</body>
</html>
